name: test

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  jinja-reference:
    name: Python Jinja2 reference
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15.0'

      - name: Install pinned reference dependencies
        run: python -m pip install -r scripts/jinja-reference-requirements.txt

      - name: Verify exact Python output
        run: python scripts/jinja-reference.py

  test:
    name: test
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-tags: 1
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Go unit tests (race detector, parallel)
        run: make test PARALLEL=4
